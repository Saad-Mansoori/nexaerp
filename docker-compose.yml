services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexaerp
      POSTGRES_DB: nexaerp
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexaerp -d nexaerp']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: nexaerp
      POSTGRES_DB: nexaerp_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexaerp -d nexaerp_test']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @nexaerp/api dev"
    environment:
      NODE_ENV: development
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://nexaerp@postgres:5432/nexaerp
      DIRECT_URL: postgresql://nexaerp@postgres:5432/nexaerp
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - api-nm-root:/app/node_modules
      - api-nm-api:/app/apps/api/node_modules
      - api-nm-web:/app/apps/web/node_modules
      - api-nm-shared:/app/packages/shared/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @nexaerp/web dev"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - web-nm-root:/app/node_modules
      - web-nm-api:/app/apps/api/node_modules
      - web-nm-web:/app/apps/web/node_modules
      - web-nm-shared:/app/packages/shared/node_modules

  api-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "node apps/api/dist/main.js"
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://nexaerp@postgres:5432/nexaerp
      DIRECT_URL: postgresql://nexaerp@postgres:5432/nexaerp
      LOG_LEVEL: info
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  postgres-test-data:
  api-nm-root:
  api-nm-api:
  api-nm-web:
  api-nm-shared:
  web-nm-root:
  web-nm-api:
  web-nm-web:
  web-nm-shared:
